name: Development checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  quick:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: studio
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check patch, docs and prototype
        run: |
          git diff --check origin/main...HEAD
          node --test docs/production-flow.test.cjs prototype/prototype.test.cjs
      - name: Check Django without the full stack
        run: |
          docker build --target development --file infra/python.Dockerfile --tag studio-quick-python:dev .
          docker run --rm --network host -e STUDIO_DB_HOST=127.0.0.1 studio-quick-python:dev sh -ec '
            python apps/backend/manage.py check
            python apps/backend/manage.py makemigrations --check --dry-run
            pytest
          '
      - name: Check web
        working-directory: apps/web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm types:check
          pnpm test
          pnpm build
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record tested PR merge parents
        if: github.event_name == 'pull_request'
        run: |
          git show -s --format='Tested merge parents: %P' HEAD
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: 24
      - name: Cache fixed-version MinIO image
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/studio-minio.tar
          key: studio-minio-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/minio.Dockerfile') }}
      - name: Build MinIO on cache miss
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: |
          docker compose build minio
          docker image save -o "${RUNNER_TEMP}/studio-minio.tar" short-drama-studio-minio:dev
      - name: Load cached MinIO image
        if: github.event_name == 'pull_request' && steps.minio-cache.outputs.cache-hit == 'true'
        run: docker image load -i "${RUNNER_TEMP}/studio-minio.tar"
      - name: Start development stack
        if: github.event_name == 'pull_request'
        run: |
          docker compose build api render web
          docker compose up --no-build --wait --wait-timeout 180
      - name: Check Django, PostgreSQL and OpenAPI
        if: github.event_name == 'pull_request'
        run: |
          docker compose exec -T api python apps/backend/manage.py check
          docker compose exec -T api python apps/backend/manage.py makemigrations --check --dry-run
          docker compose exec -T api pytest
          docker compose run --rm storage-init
      - name: Check docs and prototype
        if: github.event_name == 'pull_request'
        run: node --test docs/production-flow.test.cjs prototype/prototype.test.cjs
      - name: Check web
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm types:check
          pnpm test
          pnpm build
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Show service logs
        if: failure() && github.event_name == 'pull_request'
        run: docker compose logs --no-color
      - name: Stop development stack
        if: always() && github.event_name == 'pull_request'
        run: docker compose down
