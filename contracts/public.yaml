openapi: 3.1.0
info:
  title: Short Drama Studio API
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      operationId: health_retrieve
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/projects:
    get:
      operationId: projects_list
      summary: List projects, newest first
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          maxLength: 1000
          minLength: 1
        description: nextCursor from the previous page.
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: projects_create
      summary: Create a paused project and its root task, or replay a creation
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: csrfToken from GET /api/v1/session.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/{projectId}:
    get:
      operationId: project_read
      parameters:
      - in: path
        name: projectId
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/{projectId}/asset-versions/{versionId}/preview:
    get:
      operationId: asset_version_preview
      summary: Sign a short-lived read URL for one private version
      parameters:
      - in: path
        name: projectId
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: versionId
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPreview'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/{projectId}/assets:
    get:
      operationId: assets_list
      summary: Asset cards in one scope, grouped by asset with the latest version
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          maxLength: 1000
          minLength: 1
        description: nextCursor from the previous page.
      - in: query
        name: episodeId
        schema:
          type: integer
          minimum: 1
        description: Required for scope=episode.
      - in: query
        name: kind
        schema:
          enum:
          - visual
          - character
          - scene
          - prop
          - image
          - audio
          - video
          - subtitles
          - timeline
          - delivery
          type: string
          minLength: 1
        description: |-
          visual covers character, scene and prop. delivery covers episode deliveries.

          * `visual` - visual
          * `character` - character
          * `scene` - scene
          * `prop` - prop
          * `image` - image
          * `audio` - audio
          * `video` - video
          * `subtitles` - subtitles
          * `timeline` - timeline
          * `delivery` - delivery
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
      - in: path
        name: projectId
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: q
        schema:
          type: string
          maxLength: 200
          minLength: 1
        description: Case-insensitive title or asset key search.
      - in: query
        name: scope
        schema:
          enum:
          - current
          - shared
          - all
          - episode
          type: string
          default: current
          minLength: 1
        description: |-
          * `current` - current
          * `shared` - shared
          * `all` - all
          * `episode` - episode
      - in: query
        name: shotId
        schema:
          type: integer
          minimum: 1
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/{projectId}/assets/{assetId}/versions:
    get:
      operationId: asset_versions_list
      parameters:
      - in: path
        name: assetId
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: projectId
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetVersionList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/{projectId}/deliveries:
    get:
      operationId: deliveries_list
      summary: Episode deliveries with the exact video, subtitles and timeline versions
      parameters:
      - in: query
        name: episodeId
        schema:
          type: integer
          minimum: 1
      - in: path
        name: projectId
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/{projectId}/episodes:
    get:
      operationId: episodes_list
      parameters:
      - in: path
        name: projectId
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/{projectId}/episodes/{episodeId}:
    get:
      operationId: episode_read
      parameters:
      - in: path
        name: episodeId
        schema:
          type: integer
        required: true
      - in: path
        name: projectId
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/{projectId}/episodes/{episodeId}/shots:
    get:
      operationId: shots_list
      parameters:
      - in: path
        name: episodeId
        schema:
          type: integer
        required: true
      - in: path
        name: projectId
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShotList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/{projectId}/pause:
    post:
      operationId: project_pause
      summary: Stop new claims. Claimed executions may still finish.
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: csrfToken from GET /api/v1/session.
        required: true
      - in: path
        name: projectId
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSummary'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/{projectId}/resume:
    post:
      operationId: project_resume
      summary: Allow claims again. The first resume starts production.
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: csrfToken from GET /api/v1/session.
        required: true
      - in: path
        name: projectId
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSummary'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/{projectId}/task-tree:
    get:
      operationId: task_tree_read
      summary: Running paths with shared ancestors, or a subtree two levels deep
      parameters:
      - in: path
        name: projectId
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: rootTaskId
        schema:
          type: string
          format: uuid
        description: Required for view=subtree.
      - in: query
        name: view
        schema:
          enum:
          - running
          - subtree
          type: string
          default: running
          minLength: 1
        description: |-
          * `running` - running
          * `subtree` - subtree
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTree'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/{projectId}/tasks:
    get:
      operationId: tasks_list
      summary: Locate tasks by state, with their ancestor paths
      parameters:
      - in: query
        name: blocked
        schema:
          type:
          - boolean
          - 'null'
        description: 'true: failed or awaiting provider check; false: not blocked.'
      - in: query
        name: cursor
        schema:
          type: string
          maxLength: 1000
          minLength: 1
        description: nextCursor from the previous page.
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
      - in: path
        name: projectId
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: state
        schema:
          enum:
          - waiting
          - running
          - timed_out
          - completed
          type: string
          minLength: 1
        description: |-
          * `waiting` - waiting
          * `running` - running
          * `timed_out` - timed_out
          * `completed` - completed
      - in: query
        name: taskType
        schema:
          type: string
          pattern: ^[a-z_]{1,100}$
          minLength: 1
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/{projectId}/tasks/{taskId}:
    get:
      operationId: task_read
      parameters:
      - in: path
        name: projectId
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: taskId
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/{projectId}/tasks/{taskId}/outputs:
    get:
      operationId: task_outputs_list
      summary: Exact versions produced by one task
      parameters:
      - in: path
        name: projectId
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: taskId
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskOutputs'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/{projectId}/tasks/{taskId}/retry:
    post:
      operationId: task_retry
      summary: Retry a failed-blocked or timed-out task
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: csrfToken from GET /api/v1/session.
        required: true
      - in: path
        name: projectId
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: taskId
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/session:
    get:
      operationId: session_read
      summary: Read the browser session and issue a CSRF token
      tags:
      - session
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
    post:
      operationId: session_login
      summary: Sign in with a Django account
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: csrfToken from GET /api/v1/session.
        required: true
      tags:
      - session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLogin'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    delete:
      operationId: session_logout
      summary: Sign out
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: csrfToken from GET /api/v1/session.
        required: true
      tags:
      - session
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    AssetBrief:
      type: object
      properties:
        id:
          type: string
          format: uuid
        assetKey:
          type: string
        kind:
          $ref: '#/components/schemas/KindEnum'
        title:
          type: string
        episode:
          oneOf:
          - $ref: '#/components/schemas/EpisodeRef'
          - type: 'null'
        shot:
          oneOf:
          - $ref: '#/components/schemas/ShotRef'
          - type: 'null'
        delivery:
          type: boolean
          description: Part of an episode delivery.
      required:
      - assetKey
      - delivery
      - episode
      - id
      - kind
      - shot
      - title
    AssetCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        assetKey:
          type: string
        kind:
          $ref: '#/components/schemas/KindEnum'
        title:
          type: string
        episode:
          oneOf:
          - $ref: '#/components/schemas/EpisodeRef'
          - type: 'null'
        shot:
          oneOf:
          - $ref: '#/components/schemas/ShotRef'
          - type: 'null'
        delivery:
          type: boolean
          description: Part of an episode delivery.
        versionCount:
          type: integer
        latestVersion:
          $ref: '#/components/schemas/AssetVersion'
        adoptedVersionId:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - adoptedVersionId
      - assetKey
      - delivery
      - episode
      - id
      - kind
      - latestVersion
      - shot
      - title
      - versionCount
    AssetList:
      type: object
      properties:
        scope:
          allOf:
          - $ref: '#/components/schemas/ScopeEnum'
          description: |-
            current resolves to episode or shared.

            * `shared` - shared
            * `all` - all
            * `episode` - episode
        episode:
          oneOf:
          - $ref: '#/components/schemas/EpisodeRef'
          - type: 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/AssetCard'
        nextCursor:
          type:
          - string
          - 'null'
      required:
      - episode
      - nextCursor
      - results
      - scope
    AssetPreview:
      type: object
      properties:
        versionId:
          type: string
          format: uuid
        method:
          $ref: '#/components/schemas/MethodEnum'
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        contentType:
          type: string
        sizeBytes:
          type: integer
      required:
      - contentType
      - expiresAt
      - method
      - sizeBytes
      - url
      - versionId
    AssetVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        contentType:
          type: string
        sizeBytes:
          type: integer
        adopted:
          type: boolean
          description: Selected by production for downstream use.
        slot:
          type: string
        taskId:
          type: string
          format: uuid
        taskType:
          type: string
        executionId:
          type: string
          format: uuid
      required:
      - adopted
      - assetId
      - contentType
      - createdAt
      - executionId
      - id
      - sizeBytes
      - slot
      - taskId
      - taskType
      - title
    AssetVersionList:
      type: object
      properties:
        asset:
          $ref: '#/components/schemas/AssetCard'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/AssetVersion'
          description: Newest first.
      required:
      - asset
      - versions
    CharacterProfile:
      type: object
      properties:
        name:
          type: string
        profile:
          type: string
